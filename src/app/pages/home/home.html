<main>
  <h1 class="visually-hidden">Secret Room — {{ 'home.seoH1' | transloco }}</h1>
  <div class="image-wrapper">
    <image-slider [images]="(heroItems$ | async)|| []" [autoSlide]="true" [controls]="false"/>
  </div>
  <div appScrollReveal="fade-up">
    <categories/>
  </div>
  <div appScrollReveal="fade-up">
    <best-sellers [bestSellers]="(bestSellers$ | async) || []"/>
  </div>
  <div appScrollReveal="fade-up">
    <new-arrivals [newArrivals]="(newArrivals$| async) || []"/>
  </div>
  <div appScrollReveal="fade-up">
    <sales [sales]="(sales$ | async) || []"/>
  </div>
  <div appScrollReveal="fade-up">
    <brands-section/>
  </div>
    <instagram-feed id="instagram"/>
</main>
