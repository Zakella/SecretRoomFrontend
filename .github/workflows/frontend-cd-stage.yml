name: CD - Deploy Frontend Web Store (Stage)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [stage]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Docker image
        run: |
          docker build -f Dockerfile-stage -t secret-room-frontend:stage .

      - name: Save Docker image
        run: docker save secret-room-frontend:stage | gzip > frontend-stage.tar.gz

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          key: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          source: "frontend-stage.tar.gz,docker-compose-stage.yml"
          target: "/tmp"

      - name: Deploy application to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          key: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/secretroom-frontend-stage
            cd ~/secretroom-frontend-stage

            echo "Loading Docker image..."
            docker load < /tmp/frontend-stage.tar.gz

            cp /tmp/docker-compose-stage.yml ./docker-compose.yml

            echo "Stopping old containers..."
            docker-compose down

            echo "Starting new containers..."
            docker-compose up -d

            rm -f /tmp/frontend-stage.tar.gz
            rm -f /tmp/docker-compose-stage.yml

            echo "Deployment completed!"

      - name: Clean up old Docker images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          key: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          script: |
            docker image prune -af --filter "until=24h"

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          key: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          script: |
            echo "Checking container status..."
            docker ps | grep secret-room-frontend-stage || echo "Container not found!"

            echo "Waiting for application to start..."
            sleep 10

            echo "Checking health..."
            curl -f http://localhost:5001 || echo "Health check failed!"
